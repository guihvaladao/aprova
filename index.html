<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APROVA DOPAMINE — aprovação de artes e vídeos</title>
<meta name="theme-color" content="#F7F3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C21" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/selo.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/selo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar" hidden>
  <button class="brand" data-nav="home" title="APROVA DOPAMINE">
    <!-- Arquivos oficiais da marca. Aceita .svg ou .png (data-alt é o plano B).
         Enquanto o arquivo não estiver em assets/, a imagem some sozinha —
         o wordmark nunca é recriado em tipografia. -->
    <img class="seal on-paper" src="assets/selo.svg" data-alt="assets/selo.png" alt="dopamine">
    <img class="seal on-ink" src="assets/selo-claro.svg" data-alt="assets/selo-claro.png"
         alt="" aria-hidden="true">
    <img class="on-paper" src="assets/wordmark.svg" data-alt="assets/wordmark.png" alt="dopamine">
    <img class="on-ink" src="assets/wordmark-claro.svg" data-alt="assets/wordmark-claro.png"
         alt="" aria-hidden="true">
    <span class="sys">Aprova</span>
  </button>
  <div class="spacer"></div>
  <div class="bell-wrap">
    <button id="bell" class="ghost" title="Notificações" aria-label="Notificações">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span id="bell-count" hidden>0</span>
    </button>
    <div id="notif-panel" class="panel" hidden></div>
  </div>
  <span id="whoami" class="muted"></span>
  <button id="logout" class="ghost">Sair</button>
</header>

<main id="app"><p class="muted center">Carregando…</p></main>

<div id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
